<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week overview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&amp;display=swap">
<style>
body{margin:0}
a{color:#2F6B4F}a:hover{color:#1F4A36}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F5F1; color: #1C2321; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.1">This week</h1>
<div style="display: flex; gap: 4px">
<button aria-label="Previous week" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D8D0; background: #FFFFFF; color: #1C2321; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button aria-label="Next week" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D3D8D0; background: #FFFFFF; color: #1C2321; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
<div style="font-size: 14px; color: #5A635F">5 – 11 October</div>
</div>

<div style="margin: 16px 20px 0; background: #FFFFFF; border-radius: 18px; padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(28,35,33,0.06)">
<div style="display: grid; grid-template-columns: 78px repeat(7, minmax(0, 1fr)); gap: 4px; align-items: center">
<div></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; background: #1C2321; color: #FFFFFF; border-radius: 8px; padding: 4px 0"><span style="font-size: 10px; font-weight: 600">{{d.name}}</span><span style="font-size: 13px; font-weight: 700">{{d.num}}</span></div>
</sc-if>
<sc-if value="{{d.other}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 1px; color: #5A635F; padding: 4px 0"><span style="font-size: 10px; font-weight: 600">{{d.name}}</span><span style="font-size: 13px; font-weight: 700; color: #1C2321">{{d.num}}</span></div>
</sc-if>
</sc-for>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display: grid; grid-template-columns: 78px repeat(7, minmax(0, 1fr)); gap: 4px; align-items: center; border-top: 1px solid #EEF0EC; padding-top: 6px">
<div style="display: flex; flex-direction: column; gap: 0"><span style="font-size: 13px; font-weight: 600; line-height: 1.2">{{r.label}}</span><span style="font-size: 11px; color: #5A635F">{{r.time}}</span></div>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="7">
<sc-if value="{{c.m}}" hint-placeholder-val="{{ false }}"><div style="height: 34px; border-radius: 8px; background: #DCE6F7; color: #1F4280; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">M</div></sc-if>
<sc-if value="{{c.ma}}" hint-placeholder-val="{{ false }}"><div style="height: 34px; border-radius: 8px; background: #FBE3CC; color: #8A4510; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ma</div></sc-if>
<sc-if value="{{c.a}}" hint-placeholder-val="{{ false }}"><div style="height: 34px; border-radius: 8px; background: #E9DFF5; color: #4F2C80; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">A</div></sc-if>
<sc-if value="{{c.open}}" hint-placeholder-val="{{ true }}"><div style="height: 34px; box-sizing: border-box; border-radius: 8px; border: 2px dashed #D9822B; background: #FFF6EA; color: #8A4510; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></div></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ false }}"><div style="height: 34px; border-radius: 8px; background: repeating-linear-gradient(135deg, #F1F2EE 0 4px, #FFFFFF 4px 8px)"></div></sc-if>
</sc-for>
</div>
</sc-for>
</div>

<div style="margin: 14px 20px 0; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 13px; font-weight: 600; color: #5A635F; letter-spacing: 0.04em; text-transform: uppercase">Who covers what</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="background: #FFFFFF; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; color: #1F4280">{{totals.m}}</span><span style="font-size: 12px; color: #3E4743">Manos</span></div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; color: #8A4510">{{totals.ma}}</span><span style="font-size: 12px; color: #3E4743">Maria</span></div>
<div style="background: #FFFFFF; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; color: #4F2C80">{{totals.a}}</span><span style="font-size: 12px; color: #3E4743">Alex</span></div>
<div style="background: #FFF6EA; border: 2px dashed #D9822B; box-sizing: border-box; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; color: #8A4510">{{totals.open}}</span><span style="font-size: 12px; color: #8A4510; font-weight: 600">Open</span></div>
</div>
</div>

<div style="flex-grow: 1"></div>

<nav style="height: 80px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E3E6E0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 12px 16px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A635F; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Today</a>
<a href="Week.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #2F6B4F; font-size: 12px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Week</a>
<a href="Needs.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A635F; font-size: 12px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></svg>Needs</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var days = names.map(function (n, i) { return { name: n, num: String(5 + i), today: i === 3, other: i !== 3 }; });
var plan = [
['Walk', '07:30', ['M','M','Ma','M','M','A','A']],
['Breakfast', '08:00', ['Ma','Ma','Ma','Ma','Ma','M','M']],
['Medicine', '09:00', ['Ma','Ma','Ma','Ma','Ma','M','M']],
['Potty break', '13:00', ['A','A','A','A','O','X','X']],
['Walk', '18:00', ['M','Ma','M','O','A','M','O']],
['Dinner', '19:00', ['M','M','M','M','Ma','Ma','A']],
['Last out', '22:30', ['Ma','M','Ma','Ma','M','O','A']]
];
var totals = { m: 0, ma: 0, a: 0, open: 0 };
var rows = plan.map(function (p) {
return {
label: p[0], time: p[1],
cells: p[2].map(function (k) {
if (k === 'M') totals.m++;
if (k === 'Ma') totals.ma++;
if (k === 'A') totals.a++;
if (k === 'O') totals.open++;
return { m: k === 'M', ma: k === 'Ma', a: k === 'A', open: k === 'O', off: k === 'X' };
})
};
});
return { days: days, rows: rows, totals: totals };
}
}
</script>
</body>
</html>
